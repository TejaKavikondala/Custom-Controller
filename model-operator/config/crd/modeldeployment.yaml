---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modeldeployments.models.hpe.io
spec:
  group: models.hpe.io
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.modelName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.readyReplicas
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["modelName", "replicas", "storageSize", "gpuPerPod"]
              properties:
                modelName:
                  type: string
                  description: "Model identifier, e.g. meta-llama/Meta-Llama-3-8B-Instruct"
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 8
                  default: 1
                  description: "Number of inference pods"
                storageSize:
                  type: string
                  description: "PVC size for model cache, e.g. 10Gi"
                gpuPerPod:
                  type: integer
                  minimum: 0
                  default: 1
                  description: "Number of GPUs to request per inference pod"
                storageClass:
                  type: string
                  default: "standard"
                  description: "StorageClass for PVC. Use 'standard' for kind, GreenLake FS class for HPE AIE"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Provisioning", "Downloading", "Ready", "Failed"]
                readyReplicas:
                  type: integer
                message:
                  type: string
                pvcName:
                  type: string
                downloadJobName:
                  type: string
                deploymentName:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "reason", "message", "lastTransitionTime"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
  scope: Namespaced
  names:
    plural: modeldeployments
    singular: modeldeployment
    kind: ModelDeployment
    shortNames:
      - md
